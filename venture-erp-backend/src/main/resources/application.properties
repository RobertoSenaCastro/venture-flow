spring.application.name=ventureflow-backend

# Database credentials are supplied by the runtime environment.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate currently updates the schema at startup and logs formatted SQL.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hosting providers may supply PORT; local execution defaults to 8080.
server.port=${PORT:8080}
server.address=0.0.0.0

# A single frontend origin is allowed to call routes under /api/**.
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}
